org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Keep the app installed after connectedAndroidTest.
#
# AGP uninstalls the app under test when the run finishes, which also destroys its data. On the
# Fold8 that means the imported 3.66GB model is gone and has to be transferred again, so the
# default is not acceptable for this project. Verified on the API 37 AVD: without this the package
# is removed, with it both APKs survive.
android.injected.androidTest.leaveApksInstalledAfterRun=true
